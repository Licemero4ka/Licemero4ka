name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Licemero4ka
          template: terminal
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv
          config_output: svg
          filename: github-metrics.svg
